name = "loi-chua-audio-gateway"
main = "src/index.js"
compatibility_date = "2026-08-24"

[[kv_namespaces]]
binding = "AUDIO_RATE_LIMITS"
# Tạo namespace ở tài khoản sở hữu website, rồi thay giá trị này trước khi deploy.
id = "6ee2c65a57c14790bdb8d49d95e6243f"

[[routes]]
pattern = "audio.loichuamoingay.org"
custom_domain = true

# Worker thuộc tài khoản website; audio được đọc/ghi chéo tài khoản qua R2 S3 API.
# Upload ở /admin cần thêm secrets SUPABASE_URL và SUPABASE_ANON_KEY.
# Có thể đặt ADMIN_EMAILS (phân cách bằng dấu phẩy) để giới hạn thêm theo email.
# ADMIN_MAX_UPLOAD_BYTES mặc định là 52428800 (50 MiB).
