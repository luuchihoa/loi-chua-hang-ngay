name = "loi-chua-audio-gateway"
main = "src/index.js"
compatibility_date = "2026-08-24"

[[kv_namespaces]]
binding = "AUDIO_RATE_LIMITS"
# Tạo namespace ở tài khoản sở hữu website, rồi thay giá trị này trước khi deploy.
id = "REPLACE_WITH_WEBSITE_ACCOUNT_KV_NAMESPACE_ID"

[[routes]]
pattern = "audio.loichuamoingay.org"
custom_domain = true

# Worker thuộc tài khoản website; audio được đọc chéo tài khoản qua R2 S3 API và secret chỉ-đọc.
